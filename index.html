<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QAZAQ SPACE</title>
<style>
:root{--bg:#0a1120;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.11);--tx:#e8eefc;--mut:#94a3c4;--ac:#2dd4bf;--ac2:#38bdf8;--ok:#34d399;--er:#fb7185;--nav:rgba(12,20,38,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef4fb;--card:rgba(255,255,255,.85);--bd:rgba(15,40,80,.12);--tx:#0f2038;--mut:#51617e;--ac:#0d9488;--ac2:#0284c7;--nav:rgba(255,255,255,.92);color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 85% -10%,rgba(56,189,248,.18),transparent),radial-gradient(700px 500px at -10% 30%,rgba(45,212,191,.12),transparent),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{display:flex;min-height:100vh}
aside{width:250px;padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;letter-spacing:.14em;font-size:15px}.logo b{color:var(--ac)}
aside .logo{padding:6px 12px 18px;cursor:pointer}
.ni{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--mut);text-align:left;transition:.2s}
.ni:hover{background:var(--card)}.ni.on{background:linear-gradient(90deg,rgba(45,212,191,.2),rgba(56,189,248,.12));color:var(--tx)}
.ni i{font-style:normal;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--card);font-size:14px}
.col{flex:1;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
header .logo{display:none}
.tb{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-size:18px}
main{max-width:920px;margin:0 auto;padding:6px 18px 40px}
nav#bn{display:none}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
h1{font-size:clamp(26px,6vw,38px);margin:.3em 0;line-height:1.15}h2{font-size:24px;margin:.4em 0}h3{margin:1.2em 0 .5em;font-size:17px}
.mut,small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;backdrop-filter:blur(10px);margin-bottom:12px}
.hero{position:relative;overflow:hidden;padding:26px 22px;background:linear-gradient(135deg,rgba(45,212,191,.18),rgba(56,189,248,.08) 60%,transparent),var(--card)}
.orb{position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;border:1px dashed var(--bd);animation:sp 30s linear infinite}
.orb::after{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 0 18px var(--ac)}
@keyframes sp{to{transform:rotate(360deg)}}
.slog{color:var(--ac);font-weight:600;margin:6px 0 0}
.grid4,.grid3,.grid2{display:grid;gap:12px;margin-bottom:12px}
.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}
.cat{display:flex;flex-direction:column;gap:4px;text-align:left;margin:0;transition:.2s}.cat:hover{transform:translateY(-3px);border-color:var(--ac)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06202a;font-weight:800;font-size:15px;margin-bottom:6px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#05202b;font-weight:700;padding:12px 20px;border-radius:14px;transition:.2s}.btn:active{transform:scale(.97)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stats b{display:block;font-size:24px;color:var(--ac)}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left}.row>span:nth-child(2){flex:1}
.num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bd);font-weight:700}
.tag{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--bd);color:var(--mut);display:inline-block}.tag.ok{background:rgba(52,211,153,.2);color:var(--ok)}
.back{color:var(--ac);padding:8px 0}
.w{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}.w:last-child{border:0}.w b{color:var(--ac)}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;margin:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--bd);transition:.2s}.opt:hover{border-color:var(--ac)}
.opt.ok{background:rgba(52,211,153,.2);border-color:var(--ok)}.opt.bad{background:rgba(251,113,133,.18);border-color:var(--er)}
.fb{min-height:24px;margin:8px 0;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--er)}
.bigw{font-size:38px;font-weight:800;text-align:center;color:var(--ac);padding:18px 0}
.line{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:14px;border:1px dashed var(--ac);margin:10px 0;align-items:center}
.chip{padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bd);transition:.2s}.chip.on,.chip:hover{border-color:var(--ac);color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.demo{padding:10px 14px;border-radius:14px;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.4);font-size:14px;margin-bottom:10px}
.chat{max-height:48vh;min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.msg{max-width:85%;padding:11px 15px;border-radius:18px;background:var(--card);border:1px solid var(--bd);animation:fd .3s}.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#05202b;border:0}
.typing{display:flex;gap:5px;width:64px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-6px)}}
.send{display:flex;gap:8px}.send input,textarea{flex:1;width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:130px;resize:vertical;margin-bottom:8px}
.al{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}.al span{padding:12px 0;text-align:center;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-weight:700}.al .sp{background:rgba(45,212,191,.2);border-color:var(--ac);color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:26px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:var(--ok);color:#05261a;padding:11px 20px;border-radius:30px;font-weight:700;opacity:0;pointer-events:none;transition:.35s;z-index:30;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){aside{display:none}header .logo{display:block}main{padding:4px 14px 110px}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}
nav#bn{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav#bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:5px 0}nav#bn button i{font-style:normal;font-size:18px}nav#bn .on{color:var(--ac)}#toast{bottom:100px}}
</style>
</head>
<body>
<div class="app"><aside id="side"></aside><div class="col"><header><span class="logo" onclick="go('home')">QAZAQ <b>SPACE</b></span><button class="tb" id="tb" onclick="theme()" aria-label="Тема"></button></header><main id="v"></main></div></div>
<nav id="bn"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const DEF={l:[],p:0,g:[],c:[],th:''};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('qs')||'{}'))}catch(e){S=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem('qs',JSON.stringify(S))}catch(e){}};
if(!S.th)S.th=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
const L=[
{cat:'Приветствия',kk:'Сәлемдесу',ru:'Приветствия и знакомство',w:[['сәлем','привет'],['сәлеметсіз бе','здравствуйте'],['қайырлы таң','доброе утро'],['менің атым…','меня зовут…'],['сау бол','до свидания']],ex:[['Сәлем! Менің атым Анна.','Привет! Меня зовут Анна.'],['Қайырлы таң, мұғалім!','Доброе утро, учитель!']],q:['Как переводится «қайырлы таң»?','доброе утро','до свидания','спасибо']},
{cat:'Числа',kk:'Сандар',ru:'Числа от 1 до 5',w:[['бір','один'],['екі','два'],['үш','три'],['төрт','четыре'],['бес','пять']],ex:[['Менде екі кітап бар.','У меня две книги.'],['Сыныпта бес оқушы бар.','В классе пять учеников.']],q:['Что означает «үш»?','три','пять','два']},
{cat:'Семья',kk:'Менің отбасым',ru:'Моя семья',w:[['отбасы','семья'],['ана','мама'],['әке','папа'],['аға','старший брат'],['әже','бабушка']],ex:[['Менің әкем мұғалім.','Мой папа учитель.'],['Бұл — менің анам.','Это моя мама.']],q:['Как переводится «әже»?','бабушка','папа','семья']}];
const D=[['сәлем','привет','daily'],['рахмет','спасибо','daily'],['су','вода','daily'],['нан','хлеб','daily'],['үй','дом','daily'],['дос','друг','daily'],['кітап','книга','school'],['мектеп','школа','school'],['сынып','класс','school'],['мұғалім','учитель','school'],['оқушы','ученик','school'],['қалам','ручка','school']];
const ALL=D.map(x=>[x[0],x[1]]).concat(...L.map(l=>l.w)).filter(w=>!/[…\s]/.test(w[0]));
const EXS=[].concat(...L.map(l=>l.ex),[['Менің досым — Айдар.','Мой друг — Айдар.'],['Мен мектепке барамын.','Я иду в школу.']]);
const SENT=[[['Мен','мектепке','барамын'],'Я иду в школу'],[['Менің','атым','Анна'],'Меня зовут Анна'],[['Бұл','менің','кітабым'],'Это моя книга'],[['Сыныпта','бес','оқушы','бар'],'В классе пять учеников']];
const CR=[{t:'Өзім туралы',d:'Напишите минимум 3 предложения о себе: как вас зовут, сколько вам лет. Подсказка: «Менің атым…».',m:3},{t:'Менің отбасым',d:'Опишите свою семью 4 предложениями. Подсказка: ана, әке, аға, әже.',m:4},{t:'Суретті сипатта',d:'Представьте: в классе урок, учитель стоит у доски, пять учеников сидят за партами. Опишите ситуацию (3 предложения).',m:3},{t:'Жоба: Менің сыныбым',d:'Мини-проект: напишите рассказ о своём классе — 5 предложений на казахском.',m:5}];
const NAV=[['home','Басты бет','⌂'],['lang','Тіл әлемі','Ә'],['games','Ойын алаңы','◈'],['ai','AI көмекші','✦'],['cr','Шығармашылық','✎']];
let V='home',A,Q=[],F,B,M=[['bot','Сәлем! 👋 Я <b>демо-помощник</b> QAZAQ SPACE. Могу объяснить слово, перевести простое предложение, исправить типичную ошибку или привести пример. Выберите вопрос ниже или напишите свой.']],busy=false,CT=0,rst=false;
const pct=()=>Math.round((S.l.length/3+S.g.length/2+S.c.length/4)/3*100);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}
function theme(){S.th=S.th==='dark'?'light':'dark';save();applyTh()}
function applyTh(){document.documentElement.dataset.theme=S.th;$('#tb').textContent=S.th==='dark'?'☀':'☾'}
function go(v,a){V=v;A=a;render(1);scrollTo(0,0)}
function render(an){$('#v').innerHTML=`<div class="${an?'fade':''}">${VIEWS[V](A)}</div>`;const k=V==='alpha'||V==='vocab'||V==='lesson'?'lang':V==='gf'||V==='gb'?'games':V;document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(V==='ai'){const c=$('#chat');c.scrollTop=c.scrollHeight}}
function pts(n){S.p+=n;save()}
const VIEWS={
home(){const n=L.findIndex((x,i)=>!S.l.includes(i)),p=pct();
return `<section class="card hero"><div class="orb"></div><div class="logo">QAZAQ <b>SPACE</b></div><p class="slog">Тіл. Ойын. ЖИ. Шығармашылық.</p><h1>Сәлем, оқушы! 👋</h1><p class="mut">Авторлық педагогикалық модель. Инновационное пространство для изучения казахского языка представителями других национальностей: уроки, игры, ИИ-помощник и творчество в одном месте.</p></section>
<div class="grid4">${[['lang','ТІЛ','Уроки казахского','Ә'],['games','ОЙЫН','Игры и баллы','◈'],['ai','ЖИ','AI-помощник','✦'],['cr','ШЫҒАРМАШЫЛЫҚ','Творческие задания','✎']].map(c=>`<button class="card cat" onclick="go('${c[0]}')"><span class="ic">${c[3]}</span><b>${c[1]}</b><small>${c[2]}</small></button>`).join('')}</div>
<div class="card"><small>Продолжить обучение</small>${n>=0?`<h3 style="margin:.3em 0">Урок ${n+1}: ${L[n].kk}</h3><p class="mut" style="margin:0 0 12px">${L[n].ru}</p><button class="btn" onclick="go('lesson',${n})">Продолжить →</button>`:`<h3 style="margin:.3em 0">Все демо-уроки пройдены 🎉</h3><button class="btn" onclick="go('games')">Закрепить в играх →</button>`}</div>
<div class="card"><b>Ваш прогресс — ${p}%</b><div class="bar"><i style="width:${p}%"></i></div><div class="stats"><div><b>${S.l.length}/3</b><small>уроков</small></div><div><b>${S.p}</b><small>баллов</small></div><div><b>${S.g.length}/2</b><small>игр пройдено</small></div></div></div>
<div class="chips"><button class="chip" onclick="go('lang')">Уроки</button><button class="chip" onclick="go('games')">Играть</button><button class="chip" onclick="go('ai')">Спросить помощника</button><button class="chip" onclick="reset()">${rst?'Нажмите ещё раз для сброса':'Сбросить прогресс'}</button></div>
<p class="mut" style="font-size:13px">Материалы демонстрационные и не являются утверждённой педагогической программой.</p>`},
lang(){const C=[['Алфавит','А',"go('alpha')"],['Базовая лексика','Сөз',"go('vocab')"],['Приветствия','👋',"go('lesson',0)"],['Числа','123',"go('lesson',1)"],['Семья','♥',"go('lesson',2)"],['Школа','✎',"go('vocab','school')"],['Повседневное общение','☺',"go('vocab','daily')"]];
return `<h2>Тіл әлемі</h2><p class="mut">Выберите тему или начните с урока.</p><div class="grid3">${C.map(c=>`<button class="card cat" onclick="${c[2]}"><span class="ic">${c[1]}</span><b>${c[0]}</b></button>`).join('')}</div><h3>Демо-уроки</h3>${L.map((l,i)=>{const d=S.l.includes(i);return `<button class="card row" onclick="go('lesson',${i})"><span class="num">${i+1}</span><span><b>${l.kk}</b><br><small>${l.ru}</small></span><span class="tag ${d?'ok':''}">${d?'Пройден':'Новый'}</span></button>`}).join('')}`},
alpha(){const a='А Ә Б В Г Ғ Д Е Ё Ж З И Й К Қ Л М Н Ң О Ө П Р С Т У Ұ Ү Ф Х Һ Ц Ч Ш Щ Ъ Ы І Ь Э Ю Я'.split(' ');
return `<button class="back" onclick="go('lang')">← Тіл әлемі</button><h2>Қазақ әліпбиі</h2><p class="mut">42 буквы. Выделены 9 специфических букв казахского языка.</p><div class="al">${a.map(c=>`<span class="${'ӘҒҚҢӨҰҮҺІ'.includes(c)?'sp':''}">${c}</span>`).join('')}</div>`},
vocab(g){const w=g?D.filter(x=>x[2]===g):ALL;return `<button class="back" onclick="go('lang')">← Тіл әлемі</button><h2>${g==='school'?'Мектеп · Школа':g==='daily'?'Күнделікті сөздер · Повседневное':'Негізгі сөздер · Базовая лексика'}</h2><div class="card">${w.map(x=>`<div class="w"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`},
lesson(i){const l=L[i];Q=shuf([l.q[1],l.q[2],l.q[3]]);
return `<button class="back" onclick="go('lang')">← К урокам</button><div class="card"><span class="tag">Урок ${i+1} · ${l.cat}</span><h2>${l.kk}</h2><p class="mut" style="margin:0">${l.ru}</p></div><h3>Жаңа сөздер · Новые слова</h3><div class="card">${l.w.map(x=>`<div class="w"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><h3>Мысалдар · Примеры</h3><div class="card">${l.ex.map(x=>`<p style="margin:6px 0"><b>${x[0]}</b><br><small>${x[1]}</small></p>`).join('')}</div><h3>Практика</h3><div class="card"><b>${l.q[0]}</b>${Q.map((o,k)=>`<button class="opt" id="o${k}" onclick="lq(${i},${k})">${o}</button>`).join('')}<div id="fb" class="fb"></div></div><button class="btn" onclick="${i<2?`go('lesson',${i+1})`:`go('lang')`}">${i<2?'Следующий урок →':'К списку тем'}</button>`},
games(){return `<h2>Ойын алаңы</h2><p class="mut">Ваши баллы: <b>${S.p}</b></p><div class="grid2"><div class="card"><span class="ic">?</span><h3 style="margin:.2em 0">Сөзді тап</h3><p class="mut">Выберите верный перевод казахского слова. 5 раундов, +5 баллов за ответ.</p><span class="tag ${S.g.includes('find')?'ok':''}">${S.g.includes('find')?'Пройдена':'Не пройдена'}</span><p><button class="btn" onclick="fStart()">Играть</button></p></div><div class="card"><span class="ic">≡</span><h3 style="margin:.2em 0">Сөйлем құрастыр</h3><p class="mut">Составьте предложение из слов. 4 раунда, +10 баллов за предложение.</p><span class="tag ${S.g.includes('build')?'ok':''}">${S.g.includes('build')?'Пройдена':'Не пройдена'}</span><p><button class="btn" onclick="bStart()">Играть</button></p></div></div>`},
gf(){if(F.i>=5)return `<div class="card empty"><h2>Нәтиже · Результат</h2><p style="font-size:22px;color:var(--ok)"><b>${F.sc}</b> из 25 баллов</p><button class="btn" onclick="fStart()">Играть снова</button> <button class="btn g" onclick="go('games')">К играм</button></div>`;
const r=F.q[F.i];return `<button class="back" onclick="go('games')">← К играм</button><div class="card"><small>Раунд ${F.i+1}/5 · очки: ${F.sc}</small><div class="bar"><i style="width:${F.i*20}%"></i></div><div class="bigw">${r.w}</div>${r.o.map((o,k)=>`<button class="opt ${F.s!=null?(o===r.a?'ok':k===F.s?'bad':''):''}" onclick="fA(${k})">${o}</button>`).join('')}<div class="fb ${F.s!=null&&r.o[F.s]===r.a?'ok':'bad'}">${F.s==null?'':r.o[F.s]===r.a?'Дұрыс! Верно, +5':'Қате. Правильно: '+r.a}</div>${F.s!=null?`<button class="btn" onclick="fN()">${F.i<4?'Далее →':'Результат'}</button>`:''}</div>`},
gb(){if(B.i>=4)return `<div class="card empty"><h2>Нәтиже · Результат</h2><p style="font-size:22px;color:var(--ok)"><b>${B.sc}</b> из 40 баллов</p><button class="btn" onclick="bStart()">Играть снова</button> <button class="btn g" onclick="go('games')">К играм</button></div>`;
return `<button class="back" onclick="go('games')">← К играм</button><div class="card"><small>Раунд ${B.i+1}/4 · очки: ${B.sc}</small><div class="bar"><i style="width:${B.i*25}%"></i></div><p>Составьте: <b>«${B.q[B.i][1]}»</b></p><div class="line ${B.sh?'shake':''}">${B.a.length?B.a.map((w,k)=>`<button class="chip on" onclick="bT(1,${k})">${w}</button>`).join(''):'<small>Нажимайте на слова ниже</small>'}</div><div class="chips">${B.p.map((w,k)=>`<button class="chip" onclick="bT(0,${k})">${w}</button>`).join('')}</div><div class="fb ${B.ok?'ok':'bad'}">${B.f}</div>${B.ok?`<button class="btn" onclick="bN()">${B.i<3?'Далее →':'Результат'}</button>`:`<button class="btn" onclick="bC()">Проверить</button> <button class="btn g" onclick="bR()">Сначала</button>`}</div>`},
ai(){return `<h2>AI көмекші</h2><div class="demo">⚠ Демонстрационный режим: это не настоящий подключённый ИИ. Ответы берутся из заранее подготовленных сценариев.</div><div class="card"><div class="chat" id="chat">${M.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join('')}${busy?'<div class="msg typing"><i></i><i></i><i></i></div>':''}</div></div><div class="chips">${EXQ.map((q,k)=>`<button class="chip" onclick="ask(${k})">${q}</button>`).join('')}</div><div class="send"><input id="inp" placeholder="Напишите вопрос…" onkeydown="if(event.key==='Enter')snd()"><button class="btn" onclick="snd()" aria-label="Отправить">➤</button></div>`},
cr(){const t=CR[CT],sv=S.c.find(x=>x.k===CT);
return `<h2>Шығармашылық</h2><div class="chips">${CR.map((x,k)=>`<button class="chip ${k===CT?'on':''}" onclick="CT=${k};render(1)">${k+1}. ${x.t}</button>`).join('')}</div><div class="card"><h3 style="margin-top:0">${t.t}</h3><p class="mut">${t.d}</p><textarea id="ta" placeholder="Жазыңыз…">${sv?esc(sv.x):''}</textarea><div class="chips">${[...'әғқңөұүһі'].map(c=>`<button class="chip" onclick="ins('${c}')">${c}</button>`).join('')}</div><button class="btn" onclick="crC()">Проверить и сохранить</button><div id="fb" class="fb"></div></div><h3>Сохранённые работы</h3>${S.c.length?S.c.map(x=>`<div class="card"><b>${CR[x.k].t}</b><p class="mut" style="margin:6px 0 0;white-space:pre-wrap">${esc(x.x)}</p></div>`).join(''):'<div class="card empty">Пока нет работ. Выполните задание, и оно появится здесь.</div>'}`}};
function lq(i,k){const l=L[i],ok=Q[k]===l.q[1];Q.forEach((o,j)=>$('#o'+j).classList.toggle('ok',o===l.q[1]&&(ok||j===k)));if(!ok){$('#o'+k).classList.add('bad');$('#fb').className='fb bad';$('#fb').textContent='Қате. Попробуйте ещё раз.';return}
$('#fb').className='fb ok';if(!S.l.includes(i)){S.l.push(i);pts(10);toast('Урок пройден! +10 баллов ✓');$('#fb').textContent='Дұрыс! Урок завершён, +10 баллов.'}else $('#fb').textContent='Дұрыс! Верно (урок уже засчитан).'}
function fStart(){F={q:shuf(ALL).slice(0,5).map(w=>({w:w[0],a:w[1],o:shuf([w[1]].concat(shuf(ALL.filter(x=>x[1]!==w[1])).slice(0,3).map(x=>x[1])))})),i:0,sc:0,s:null};go('gf')}
function fA(k){if(F.s!=null)return;F.s=k;if(F.q[F.i].o[k]===F.q[F.i].a){F.sc+=5;pts(5)}render()}
function fN(){F.i++;F.s=null;if(F.i>=5){if(!S.g.includes('find'))S.g.push('find');save();toast('Игра пройдена: '+F.sc+' баллов')}render(1)}
function bStart(){B={q:shuf(SENT),i:0,sc:0};bSet();go('gb')}
function bSet(){B.p=shuf(B.q[B.i][0].slice());B.a=[];B.f='';B.ok=false;B.sh=false}
function bT(x,k){if(B.ok)return;B.f='';B.sh=false;if(x)B.p.push(B.a.splice(k,1)[0]);else B.a.push(B.p.splice(k,1)[0]);render()}
function bR(){bSet();render()}
function bC(){if(B.a.join(' ')===B.q[B.i][0].join(' ')){B.ok=true;B.sc+=10;pts(10);B.f='Дұрыс! Верно, +10';B.sh=false}else{B.f=B.a.length?'Қате. Проверьте порядок слов.':'Сначала составьте предложение.';B.sh=true}render()}
function bN(){B.i++;if(B.i>=4){if(!S.g.includes('build'))S.g.push('build');save();toast('Игра пройдена: '+B.sc+' баллов')}else bSet();render(1)}
const EXQ=['Что значит «кітап»?','Переведи: Мен мектепке барамын','Исправь: Мен мектеп барамын','Приведи пример со словом «дос»'];
const TR={'мен мектепке барамын':'Я иду в школу','менің атым анна':'Меня зовут Анна','мен кітап оқимын':'Я читаю книгу','қайырлы таң':'Доброе утро'};
const FIX={'мен мектеп барамын':['Мен мектепке барамын','к слову нужно добавить окончание направления -ке: мектеп → мектепке.'],'мен үй барамын':['Мен үйге барамын','после «үй» нужно окончание -ге: үйге.'],'сен қалай':['Сен қалайсың?','нужно личное окончание -сың.']};
const norm=s=>s.toLowerCase().replace(/[«»"“”.!?,]/g,'').trim();
function reply(v){const t=norm(v),rest=norm(v.includes(':')?v.split(':').slice(1).join(':'):v),tk=t.split(/[\s:]+/);
if(/исправ|ошибк/.test(t)){const f=FIX[rest];return f?`Исправленный вариант: <b>${f[0]}</b><br>Почему: ${f[1]}`:'В демо-режиме я проверяю только заготовленные примеры, например: «Исправь: Мен мектеп барамын». В настоящей версии ИИ разбирал бы любой текст.'}
if(/перев/.test(t)&&TR[rest])return `<b>${esc(v.split(':').pop().trim())}</b> — ${TR[rest]}`;
const w=ALL.find(x=>tk.includes(x[0])||tk.includes(x[1]));
if(w){const e=EXS.find(x=>norm(x[0]).split(' ').some(y=>y.startsWith(w[0])));return `<b>${w[0]}</b> — ${w[1]}.`+(e?`<br>Пример: <b>${e[0]}</b><br><small>${e[1]}</small>`:'')}
return 'Этого сценария пока нет в демо. Попробуйте: «Что значит кітап?», «Переведи: Мен мектепке барамын» или «Исправь: Мен мектеп барамын».'}
function snd(){const i=$('#inp'),v=i.value.trim();if(!v||busy)return;M.push(['me',esc(v)]);busy=true;render();setTimeout(()=>{M.push(['bot',reply(v)]);busy=false;render()},850)}
function ask(k){$('#inp').value=EXQ[k];snd()}
function ins(c){const t=$('#ta'),s=t.selectionStart;t.value=t.value.slice(0,s)+c+t.value.slice(t.selectionEnd);t.focus();t.selectionStart=t.selectionEnd=s+1}
function crC(){const x=$('#ta').value.trim(),t=CR[CT],n=x.split(/[.!?\n]+/).filter(s=>s.trim().split(/\s+/).length>=2).length,f=$('#fb');
if(n<t.m){f.className='fb bad';f.textContent=`Нужно минимум ${t.m} предложения(й), сейчас: ${n}.`;return}
const o=S.c.find(y=>y.k===CT);if(o){o.x=x;save();toast('Работа обновлена ✓')}else{S.c.push({k:CT,x});pts(15);toast('Работа сохранена! +15 баллов ✓')}render()}
function reset(){if(!rst){rst=true;render();setTimeout(()=>{rst=false;if(V==='home')render()},3500);return}S=Object.assign({},DEF,{th:S.th});save();rst=false;toast('Прогресс сброшен');render(1)}
$('#side').innerHTML='<div class="logo" onclick="go(\'home\')">QAZAQ <b>SPACE</b></div>'+NAV.map(n=>`<button class="ni" data-k="${n[0]}" onclick="go('${n[0]}')"><i>${n[2]}</i>${n[1]}</button>`).join('');
$('#bn').innerHTML=NAV.map(n=>`<button data-k="${n[0]}" onclick="go('${n[0]}')"><i>${n[2]}</i>${n[1]}</button>`).join('');
applyTh();render(1);
</script>
</body>
</html>
